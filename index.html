<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翼掠惊鸿</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        #start-page {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #0a1a2e;
        }

        #bg-map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: #1a2a40;
        }

        .start-mask {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
            background: radial-gradient(
                ellipse at center,
                rgba(8, 24, 48, 0.55) 0%,
                rgba(8, 24, 48, 0.75) 60%,
                rgba(5, 15, 32, 0.92) 100%
            );
            pointer-events: none;
        }

        .start-content {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 12vw;
            pointer-events: none;
            transform: translateY(calc(-16.67vh + 70px));
        }

        .start-title {
            margin-bottom: 56px;
            pointer-events: auto;
        }

        .start-title h1 {
            font-size: clamp(56px, 7.5vw, 96px);
            font-weight: 200;
            color: #ffffff;
            letter-spacing: 22px;
            padding-left: 22px;
            line-height: 1.1;
            text-shadow: 0 4px 32px rgba(0, 0, 0, 0.6);
            margin-bottom: 18px;
        }

        .start-title .subtitle {
            font-size: clamp(13px, 1.3vw, 17px);
            font-weight: 300;
            color: rgba(180, 210, 255, 0.9);
            letter-spacing: 10px;
            padding-left: 10px;
            display: flex;
            align-items: baseline;
            gap: 18px;
        }

        .start-title .version {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .btn-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 240px;
            pointer-events: auto;
        }

        .btn {
            width: 100%;
            height: 54px;
            font-size: 15px;
            font-family: inherit;
            letter-spacing: 6px;
            padding-left: 6px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .start-btn,
        .load-btn,
        .about-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .start-btn:hover,
        .load-btn:hover,
        .about-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.65);
        }

        @keyframes jellyPress {
            0%   { transform: scale(1); }
            35%  { transform: scale(0.96); }
            100% { transform: scale(1); }
        }

        .btn.pressed,
        .buy-plane-btn.pressed,
        .pc-buy.pressed,
        .back-btn.pressed,
        .naming-confirm.pressed,
        .buy-plane-btn-small.pressed,
        .fleet-btn.pressed,
        .route-create-btn.pressed,
        .ap-panel-btn.pressed {
            animation: jellyPress 0.2s ease-out;
        }

        .plane-marker {
            background: none;
            border: none;
        }

        .plane-rot {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s linear;
        }

        #about-page {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1000;
            background: #ffffff;
        }

        #about-page.active { display: block; }

        .about-center {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            user-select: none;
            pointer-events: none;
        }

        .about-copyright {
            font-size: clamp(24px, 4.5vw, 64px);
            font-weight: 200;
            letter-spacing: 6px;
            color: #1a1a1a;
            line-height: 1.2;
            text-align: center;
            white-space: nowrap;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border: 1px solid #d0d0d0;
            background: #ffffff;
            color: #333333;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .back-btn:hover {
            background: #f5f5f5;
            border-color: #999999;
        }

        #game-page {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            background: #ffffff;
        }

        #game-page.active { display: flex; }

        .top-bar {
            height: 48px;
            background: #0d2b4e;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 14px;
            flex-shrink: 0;
        }

        .top-logo {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .top-logo .icon { font-size: 18px; }

        .top-edit {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .top-money {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-left: 4px;
            white-space: nowrap;
        }

        .top-money .money-icon {
            font-size: 13px;
            color: #f5c518;
            font-weight: bold;
        }

        .top-money .money-value {
            font-size: 17px;
            font-weight: bold;
            color: #f5c518;
            letter-spacing: 1px;
        }

        .top-money .money-unit {
            font-size: 12px;
            color: rgba(245, 197, 24, 0.75);
            font-weight: 400;
        }

        .top-time {
            margin-left: auto;
            padding-right: 6px;
            font-size: 13px;
            color: #b8d0ea;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .main-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        .left-panel {
            width: 16vw;
            min-width: 150px;
            background: #ffffff;
            border-right: 1px solid #c0d4e8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .main-area {
            flex: 1;
            min-width: 0;
            position: relative;
            background: #000000;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: #e8eef5;
            touch-action: none;
        }

        .flight-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 22%;
            min-height: 100px;
            background: #fffdf2;
            border-left: 2px solid #f5c518;
            border-right: 2px solid #f5c518;
            border-bottom: 2px solid #f5c518;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            z-index: 10;
            overflow: hidden;
        }

        .flight-bar .fb-label {
            position: absolute;
            top: 0;
            left: 8px;
            background: #f5c518;
            color: #5a4a00;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 0 0 6px 6px;
            white-space: nowrap;
        }

        .overlay {
            position: absolute;
            top: max(22%, 100px);
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay.active { display: flex; }
        .overlay.no-dim { background: transparent; }

        .buy-modal {
            background: #ffffff;
            border-radius: 14px;
            width: 100%;
            height: 100%;
            max-width: 560px;
            max-height: 460px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            flex-shrink: 0;
        }

        .modal-close {
            cursor: pointer;
            font-size: 18px;
            color: #94a3b8;
            line-height: 1;
            padding: 0 4px;
            user-select: none;
        }

        .modal-close:hover { color: #475569; }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }

        .ap-panel-btn {
            padding: 2px 8px;
            background: #2b5ce6;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .ap-panel-btn:hover { background: #1e4ed4; }
        .ap-panel-btn:active { background: #1740b8; }

        #airport-panel-body {
            padding: 18px 20px;
        }

        .ap-panel-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        .ap-panel-name {
            font-size: 22px;
            font-weight: bold;
            color: #1e293b;
            letter-spacing: 1px;
        }

        .ap-panel-code {
            font-size: 13px;
            font-weight: bold;
            color: #2b5ce6;
            letter-spacing: 3px;
            padding: 3px 10px 3px 7px;
            background: #eef2ff;
            border-radius: 5px;
        }

        .ap-panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .ap-panel-item {
            background: #f8fafc;
            border: 1px solid #eef2f7;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .ap-panel-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .ap-panel-value {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .ap-panel-value .unit {
            font-size: 11px;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 3px;
            letter-spacing: 0;
        }

        .ap-panel-index {
            background: linear-gradient(135deg, #eef2ff 0%, #e2eaff 100%);
            border: 1px solid #d0dcff;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ap-panel-index-label {
            font-size: 13px;
            color: #2b5ce6;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .ap-panel-index-value {
            font-size: 32px;
            font-weight: bold;
            color: #2b5ce6;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .route-modal-body {
            position: relative;
            padding: 0;
            overflow: hidden;
        }

        .route-info {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            justify-items: center;
            padding: 60px 30px 100px;
            gap: 16px;
        }

        .route-ap { text-align: center; }

        .route-ap-name {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .route-ap-iata {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 3px;
            font-weight: 500;
        }

        .route-arrow {
            font-size: 22px;
            color: #cbd5e1;
            font-weight: 300;
            line-height: 1;
        }

        .route-create-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 6px 14px;
            background: #2b5ce6;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .route-create-btn:hover { background: #1e4ed4; }
        .route-create-btn:active { background: #1740b8; }

        .plane-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            background: #f8fafc;
        }

        .plane-card .pc-name {
            font-size: 14px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .plane-card .pc-price {
            font-size: 13px;
            color: #dc2626;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .plane-card .pc-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
            font-size: 12px;
            color: #475569;
            margin-bottom: 12px;
        }

        .plane-card .pc-buy {
            display: block;
            width: 100%;
            padding: 8px 0;
            background: #2b5ce6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
        }

        .plane-card .pc-buy:hover { background: #1e4ed4; }
        .plane-card .pc-buy:active { background: #1740b8; }

        .plane-card .pc-buy:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .plane-card .pc-buy:disabled:hover { background: #cbd5e1; }

        .naming-form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding: 20px 8px;
        }

        .naming-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .naming-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: #1e293b;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            letter-spacing: 1px;
        }

        .naming-input:focus {
            border-color: #2b5ce6;
            background: #ffffff;
        }

        .naming-confirm {
            margin-top: 24px;
            width: 100%;
            padding: 12px 0;
            background: #2b5ce6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
            padding-left: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }

        .naming-confirm:hover { background: #1e4ed4; }
        .naming-confirm:active { background: #1740b8; }

        .toast {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -10px);
            background: rgba(20, 20, 20, 0.88);
            color: #ffffff;
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 2000;
            white-space: nowrap;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .right-panel {
            width: 32vw;
            min-width: 320px;
            background: #f0f4f8;
            border-left: 1px solid #c0d4e8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .tab-bar {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid #d0dce8;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 10px 2px;
            text-align: center;
            font-size: 13px;
            color: #444;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            user-select: none;
        }

        .tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            font-weight: bold;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
        }

        .panel-content.active {
            display: block;
            background: #ffffff;
        }

        .plane-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 2px;
        }

        .plane-panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            letter-spacing: 1px;
        }

        .buy-plane-btn-small {
            background: #2b5ce6;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            font-weight: bold;
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .buy-plane-btn-small:hover { background: #1e4ed4; }
        .buy-plane-btn-small:active { background: #1740b8; }

        .fleet-empty {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 40px 0;
            letter-spacing: 1px;
        }

        .fleet-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .fleet-card .fc-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .fleet-card .fc-name {
            font-size: 15px;
            font-weight: bold;
            color: #2b5ce6;
            letter-spacing: 0.5px;
        }

        .fleet-card .fc-status {
            font-size: 12px;
            color: #16a34a;
            background: #dcfce7;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 500;
        }

        .fleet-card .fc-info {
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .fleet-card .fc-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }

        .fleet-btn {
            padding: 4px 12px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 500;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .fleet-btn.schedule {
            background: #e9eef4;
            color: #475569;
            border: 1px solid #e0e6ed;
        }

        .fleet-btn.schedule:hover { background: #dbe3ec; }
        .fleet-btn.schedule:active { background: #cbd5e1; }

        .fleet-btn.sell {
            background: #fde6e6;
            color: #dc2626;
            border: 1px solid #fbd5d5;
        }

        .fleet-btn.sell:hover { background: #fbd5d5; }
        .fleet-btn.sell:active { background: #f8b4b4; }

        .bottom-bar {
            height: 46px;
            background: #f5f8fb;
            border-top: 1px solid #c0d4e8;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 8px;
            flex-shrink: 0;
        }

        .pause-btn {
            padding: 6px 14px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid #c0d4e8;
            background: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            color: #444;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }

        .pause-btn:hover { background: #f1f5f9; }

        .pause-btn.active {
            background: #e2e8f0;
            color: #1e293b;
            font-weight: bold;
        }

        .speed-group {
            display: inline-flex;
            border: 1px solid #c0d4e8;
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff;
        }

        .speed-seg {
            border: none;
            background: transparent;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            color: #444;
            cursor: pointer;
            line-height: 1.2;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .speed-seg:hover { background: #f1f5f9; }

        .speed-seg.active {
            background: #e2e8f0;
            color: #1e293b;
            font-weight: bold;
        }

        .speed-seg.active:hover { background: #dbe3ec; }

        .bottom-spacer { flex: 1; }

        .save-btn {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #c0d4e8;
            background: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 1366px) {
            .left-panel { width: 14vw; min-width: 130px; }
            .right-panel { width: 30vw; min-width: 280px; }
        }

        @media (max-width: 1024px) {
            .left-panel { width: 12vw; min-width: 110px; }
            .right-panel { width: 34vw; min-width: 260px; }
            .tab { font-size: 12px; }
            .panel-content { padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="start-page">
        <div id="bg-map"></div>
        <div class="start-mask"></div>

        <div class="start-content">
            <div class="start-title">
                <h1>翼掠惊鸿</h1>
                <div class="subtitle">
                    <span>Winged Echo</span>
                    <span class="version">版本 0.1.0 · Winged Echo.V0.1.0</span>
                </div>
            </div>

            <div class="btn-box">
                <button class="btn start-btn" onclick="enterGame(this)">开始游戏</button>
                <button class="btn load-btn">读取存档</button>
                <button class="btn about-btn" onclick="openAbout(this)">关于</button>
            </div>
        </div>
    </div>

    <div id="about-page">
        <button class="back-btn" onclick="closeAbout(this)">←</button>
        <div class="about-center">
            <div class="about-copyright">© 2026 a_cathay_359</div>
        </div>
    </div>

    <div id="game-page">
        <div class="top-bar">
            <div class="top-logo"><span class="icon">✈</span>翼掠惊鸿</div>
            <button class="top-edit">修改</button>
            <div class="top-money">
                <span class="money-icon">¥</span>
                <span class="money-value" id="money-value">10.00</span>
                <span class="money-unit">亿</span>
            </div>
            <div class="top-time" id="time-display">2027年1月1日 00:00</div>
        </div>

        <div class="main-body">
            <div class="left-panel"></div>

            <div class="main-area">
                <div id="map"></div>

                <div class="flight-bar">
                    <div class="fb-label">航班动态</div>
                </div>

                <div id="toast" class="toast"></div>

                <div id="buy-overlay" class="overlay" onclick="if(event.target===this) closeBuyModal()">
                    <div class="buy-modal">
                        <div class="modal-header">
                            <span>购买飞机</span>
                            <span class="modal-close" onclick="closeBuyModal()">✕</span>
                        </div>
                        <div class="modal-body">
                            <div class="plane-card">
                                <div class="pc-name">空客 A320neo (LEAP-1A)</div>
                                <div class="pc-price">¥ 4.3 亿</div>
                                <div class="pc-stats">
                                    <span>🛫 巡航速度：850 km/h</span>
                                    <span>📏 航程：6200 km</span>
                                    <span>⚖️ 最大起飞重量：79 吨</span>
                                    <span>📦 最大载重：17 吨</span>
                                    <span>⛽ 燃油容量：26000 升</span>
                                    <span>🔥 巡航油耗：2.94 升/千米</span>
                                </div>
                                <button class="pc-buy" id="pc-buy-btn" onclick="buyPlane(this)">购买</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="route-overlay" class="overlay" onclick="if(event.target===this) closeRouteModal()">
                    <div class="buy-modal">
                        <div class="modal-header">
                            <span>建立航线</span>
                            <span class="modal-close" onclick="closeRouteModal()">✕</span>
                        </div>
                        <div class="modal-body route-modal-body">
                            <div class="route-info">
                                <div class="route-ap">
                                    <div class="route-ap-name" id="route-from-name">—</div>
                                    <div class="route-ap-iata" id="route-from-iata">—</div>
                                </div>
                                <div class="route-arrow">→</div>
                                <div class="route-ap">
                                    <div class="route-ap-name" id="route-to-name">—</div>
                                    <div class="route-ap-iata" id="route-to-iata">—</div>
                                </div>
                            </div>
                            <button class="route-create-btn" onclick="confirmRoute(this)">+ 建立</button>
                        </div>
                    </div>
                </div>

                <div id="naming-overlay" class="overlay" onclick="if(event.target===this) closeNamingModal()">
                    <div class="buy-modal">
                        <div class="modal-header">
                            <span>确认购买</span>
                            <span class="modal-close" onclick="closeNamingModal()">✕</span>
                        </div>
                        <div class="modal-body">
                            <div class="naming-form">
                                <label class="naming-label">飞机名称</label>
                                <input
                                    type="text"
                                    id="naming-input"
                                    class="naming-input"
                                    value="A320neo-0001"
                                    spellcheck="false"
                                    autocomplete="off"
                                >
                                <button class="naming-confirm" onclick="confirmBuy(this)">确认购买</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="airport-panel-overlay" class="overlay" onclick="if(event.target===this) closeAirportPanel()">
                    <div class="buy-modal">
                        <div class="modal-header">
                            <span>机场面板</span>
                            <span class="modal-close" onclick="closeAirportPanel()">✕</span>
                        </div>
                        <div class="modal-body" id="airport-panel-body"></div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="tab-bar">
                    <div class="tab active" onclick="switchTab(this, 'tab-passenger')">客流</div>
                    <div class="tab" onclick="switchTab(this, 'tab-plane')">飞机</div>
                    <div class="tab" onclick="switchTab(this, 'tab-route')">航线</div>
                    <div class="tab" onclick="switchTab(this, 'tab-airport')">机场</div>
                </div>

                <div id="tab-passenger" class="panel-content active"></div>

                <div id="tab-plane" class="panel-content">
                    <div class="plane-panel-header">
                        <span class="plane-panel-title">飞机列表</span>
                        <button class="buy-plane-btn-small" onclick="openBuyModal(this)">+ 采购</button>
                    </div>
                    <div id="fleet-list"></div>
                </div>

                <div id="tab-route" class="panel-content"></div>

                <div id="tab-airport" class="panel-content"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="pause-btn" id="pause-btn" onclick="togglePause()">⏸ 暂停</button>

            <div class="speed-group">
                <button class="speed-seg" data-speed="1"    onclick="setGameSpeed(1)">1X</button>
                <button class="speed-seg" data-speed="2"    onclick="setGameSpeed(2)">2X</button>
                <button class="speed-seg" data-speed="30"   onclick="setGameSpeed(30)">30X</button>
                <button class="speed-seg" data-speed="360"  onclick="setGameSpeed(360)">360X</button>
                <button class="speed-seg" data-speed="1800" onclick="setGameSpeed(1800)">1800X</button>
                <button class="speed-seg" data-speed="3600" onclick="setGameSpeed(3600)">3600X</button>
            </div>

            <div class="bottom-spacer"></div>
            <button class="save-btn">💾 存档</button>
            <button class="save-btn">📁 读档</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="game.js"></script>

</body>
</html>
